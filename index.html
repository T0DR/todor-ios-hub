<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub</title>
<meta name="description" content="Persönlicher Hub für Erinnerungen, Kalender, Notizen und iCloud Drive.">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hub">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="boot.js"></script>
</head>
<body>
<a class="skip" href="#main">Zum Inhalt</a>
<div class="cursor-dot" aria-hidden="true"></div>
<div class="cursor-ring" aria-hidden="true"></div>

<header class="nav glass" id="nav">
  <a class="brand" href="#top" data-act="top"><span class="brand-mark" aria-hidden="true"></span><span id="brandName">Hub</span></a>
  <nav class="nav-links" id="navLinks" aria-label="Bereiche"></nav>
  <div class="nav-actions">
    <button class="icon-btn" data-act="outbox" aria-label="Synchronisieren">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 0 1-13.7 5.7M4 12a8 8 0 0 1 13.7-5.7M18 2v4.5h-4.5M6 22v-4.5h4.5"/></svg>
      <span class="badge" id="outboxBadge" hidden>0</span>
    </button>
    <button class="icon-btn" data-act="theme" aria-label="Hell/Dunkel umschalten">
      <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
      <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button class="icon-btn burger" data-act="menu" aria-label="Menü" aria-expanded="false" aria-controls="mobileMenu"><span></span><span></span></button>
  </div>
  <nav class="mobile-menu" id="mobileMenu" aria-label="Bereiche mobil"></nav>
</header>

<main id="main">
  <section class="hero" id="top">
    <div class="hero-text reveal">
      <p class="eyebrow" id="heroDate"></p>
      <h1 class="display" id="heroTitle">Willkommen in <em>deinem Hub.</em></h1>
      <p class="lead" id="heroLead">Erinnerungen, Kalender, Notizen und iCloud Drive – an einem Ort, direkt verbunden mit deinem iPhone.</p>
      <div class="pills">
        <button class="pill primary" data-act="sync">Aktualisieren ↻</button>
        <button class="pill" data-act="quick">Neu +</button>
        <a class="pill ghost" href="#pages">Seiten ↓</a>
      </div>
      <p class="sync-state" id="syncState"></p>
    </div>
    <div class="hero-card glass reveal" id="heroCard"></div>
    <a class="scroll-hint" href="#today">NACH UNTEN ↓</a>
  </section>

  <div id="sections">
    <section class="section" id="today" data-section="today">
      <header class="sec-head reveal"><p class="eyebrow"></p><h2></h2></header>
      <div class="sec-body" id="todayBody"></div>
    </section>

    <section class="section" id="reminders" data-section="reminders">
      <header class="sec-head reveal"><p class="eyebrow"></p><h2></h2></header>
      <div class="toolbar reveal">
        <div class="seg" id="remFilter" role="tablist">
          <button data-f="today">Heute</button><button data-f="planned">Geplant</button><button data-f="all">Alle</button><button data-f="done">Erledigt</button>
        </div>
        <input class="search" type="search" id="remSearch" placeholder="Suchen" aria-label="Erinnerungen durchsuchen">
      </div>
      <div class="chips" id="remLists"></div>
      <form class="quick-add glass" id="remQuick" autocomplete="off">
        <input id="remQuickInput" placeholder="Neue Erinnerung … z. B. „Milch kaufen morgen 18 Uhr #Einkauf !“" aria-label="Neue Erinnerung">
        <button class="pill primary sm" type="submit">Hinzufügen</button>
      </form>
      <div class="list" id="remBody"></div>
    </section>

    <section class="section" id="calendar" data-section="calendar">
      <header class="sec-head reveal"><p class="eyebrow"></p><h2></h2></header>
      <div class="toolbar reveal">
        <div class="week" id="calWeek"></div>
        <button class="pill sm" data-act="newEvent">Termin +</button>
      </div>
      <div class="agenda" id="calBody"></div>
    </section>

    <section class="section" id="notes" data-section="notes">
      <header class="sec-head reveal"><p class="eyebrow"></p><h2></h2></header>
      <div class="toolbar reveal">
        <input class="search" type="search" id="noteSearch" placeholder="Notizen durchsuchen" aria-label="Notizen durchsuchen">
        <button class="pill sm" data-act="newNote">Notiz +</button>
      </div>
      <div class="grid" id="noteBody"></div>
    </section>

    <section class="section" id="files" data-section="files">
      <header class="sec-head reveal"><p class="eyebrow"></p><h2></h2></header>
      <div class="toolbar reveal">
        <input class="search" type="search" id="fileSearch" placeholder="Dateien durchsuchen" aria-label="Dateien durchsuchen">
        <a class="pill sm" id="openFilesApp" href="shareddocuments://" rel="noopener">In Dateien öffnen ↗</a>
      </div>
      <div class="list" id="fileBody"></div>
    </section>

    <section class="section" id="pages" data-section="pages">
      <header class="sec-head reveal"><p class="eyebrow"></p><h2></h2></header>
      <div class="toolbar reveal">
        <input class="search" type="search" id="pageSearch" placeholder="Seiten durchsuchen oder #tag" aria-label="Seiten durchsuchen">
        <button class="pill primary sm" data-act="newPage">Seite +</button>
      </div>
      <div class="chips" id="pageTags"></div>
      <div class="grid" id="pageBody"></div>
    </section>

    <section class="section" id="settings" data-section="settings">
      <header class="sec-head reveal"><p class="eyebrow"></p><h2></h2></header>
      <div class="settings" id="setBody"></div>
    </section>
  </div>
</main>

<footer class="footer">
  <span class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="footName">Hub</span></span>
  <span class="foot-note" id="footYear"></span>
</footer>

<button class="fab" data-act="quick" aria-label="Neu erstellen">+</button>

<dialog id="dlg" class="sheet"></dialog>
<dialog id="pageDlg" class="sheet full"></dialog>

<div class="lock" id="lock" hidden>
  <form class="lock-card glass" id="lockForm">
    <span class="brand-mark big" aria-hidden="true"></span>
    <h2>Hub ist <em>gesperrt.</em></h2>
    <p class="muted" id="lockMsg">Gib deine Passphrase ein.</p>
    <input type="password" id="lockPass" autocomplete="current-password" placeholder="Passphrase" aria-label="Passphrase" required>
    <button class="pill primary" type="submit">Entsperren</button>
    <p class="error" id="lockErr" role="alert"></p>
  </form>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="markdown.js" defer></script>
<script src="script.js" defer></script>
</body>
</html>
